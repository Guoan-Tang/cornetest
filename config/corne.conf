# Enable SSD1306 128x32 OLED with custom status screen
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_IDLE_TIMEOUT=180000
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y

# Pure wired/USB power (no battery attached)
CONFIG_ZMK_BATTERY_REPORTING=n

# Required by the converted Vial keymap (mouse + browser/media keys)
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y
